<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetTag NFC - Acceso</title>
  <style>
    :root {
      --primary: #6366F1;
      --bg: #0B0F19;
      --card-bg: #131B2E;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
      --accent: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      --shadow-soft: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
    }

    [data-theme="light"] {
      --bg: #F1F5F9;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --accent: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-glow: 0 0 20px rgba(79, 70, 229, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.3s, color 0.3s; }
    
    body { 
      background-color: var(--bg); 
      background-image: radial-gradient(var(--border) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 16px; 
    }

    .auth-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 28px; 
      width: 100%; 
      max-width: 400px; 
      padding: 36px 28px; 
      box-shadow: var(--shadow-soft); 
      position: relative; 
    }

    .top-actions { position: absolute; top: 20px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; }
    .back-link { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; }

    .auth-logo { text-align: center; font-size: 24px; font-weight: 800; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 30px 0 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .social-btn { 
      width: 100%; 
      background: var(--card-bg); 
      color: var(--text); 
      border: 1px solid var(--border); 
      padding: 14px; 
      border-radius: 14px; 
      font-weight: 600; 
      font-size: 14px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      margin-bottom: 20px; 
      box-shadow: var(--shadow-soft); 
    }
    .social-btn:hover { border-color: var(--primary); }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .form-input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
    .form-input:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; box-shadow: var(--shadow-glow); }
    .auth-message { margin-top: 16px; text-align: center; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body data-theme="dark">

  <div class="auth-card">
    <div class="top-actions">
      <a href="index.html" class="back-link">← Volver</a>
      <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️</button>
    </div>

    <div class="auth-logo">🐾 PetTag</div>

    <button class="social-btn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.13 0 9.87 0 12s.43 3.87 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Continuar con Google
    </button>

    <form onsubmit="handleAuth(event)">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="email" class="form-input" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Acceder o Registrarse</button>
    </form>

    <div class="auth-message" id="auth-msg"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5_UvKicVFHJO1iKj2TGgRfaALgYgiyTE",
      authDomain: "pettag-4634c.firebaseapp.com",
      projectId: "pettag-4634c",
      storageBucket: "pettag-4634c.firebasestorage.app",
      messagingSenderId: "502143406601",
      appId: "1:502143406601:web:236775336e81ca3c87ded8"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          const msg = document.getElementById('auth-msg');
          msg.style.color = '#EF4444';
          msg.textContent = 'Error con Google: ' + error.message;
        });
    }

    function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('auth-msg');

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch(() => {
          firebase.auth().createUserWithEmailAndPassword(email, password)
            .then(() => {
              window.location.href = 'index.html';
            })
            .catch((error) => {
              msg.style.color = '#EF4444';
              msg.textContent = error.message;
            });
        });
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('theme-btn');
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        body.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    }
  </script>
</body>
</html>
